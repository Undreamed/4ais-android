name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: node-libs-${{ hashFiles('scripts/node-libs.sha256') }}
      - run: ./scripts/fetch-node-libs.sh
      - name: Build Android terminal helper
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.1.13356709" > /dev/null || true
          python3 scripts/build-pty-login.py --ndk "$ANDROID_HOME/ndk/28.1.13356709"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check safe backend error hints
        run: node scripts/test-codex-errors.mjs
      - name: Check subscription usage
        run: node scripts/test-plan-usage.mjs
      - name: Build, unit test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace
      - name: Check native libraries
        run: python3 scripts/check-native-elf.py app/build/outputs/apk/debug/app-debug.apk
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: development-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload test and lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
