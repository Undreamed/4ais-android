name: Release APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  build-signed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/fetch-node-libs.sh
      - name: Build Android terminal helper
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.1.13356709" > /dev/null || true
          python3 scripts/build-pty-login.py --ndk "$ANDROID_HOME/ndk/28.1.13356709"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-codex-errors.mjs
      - name: Decode private signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Build and check signed APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleRelease testDebugUnitTest lintDebug --stacktrace
      - name: Verify native code and signature
        run: |
          python3 scripts/check-native-elf.py app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Prepare download
        run: |
          cp app/build/outputs/apk/release/app-release.apk 4ais-chatgpt-arm64.apk
          sha256sum 4ais-chatgpt-arm64.apk > SHA256SUMS.txt
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" 4ais-chatgpt-arm64.apk SHA256SUMS.txt \
            --verify-tag --title "4AIs with ChatGPT — $GITHUB_REF_NAME" --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            4ais-chatgpt-arm64.apk
            SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-checks
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
